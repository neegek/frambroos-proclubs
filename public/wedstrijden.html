<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijden · Frambroos Coach</title>
<link rel="icon" href="crest.png">
<meta name="theme-color" content="#090b0d">
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <header class="page-head">
      <div>
        <h1>Wedstrijden</h1>
        <p class="sub" id="page-sub">Alle gevolgde wedstrijden.</p>
      </div>
      <div class="filters">
        <label class="filter" data-icon="trophy">Type
          <select id="type">
            <option value="all">Alles</option>
            <option value="leagueMatch">League</option>
            <option value="playoffMatch">Playoff</option>
            <option value="friendlyMatch">Vriendschappelijk</option>
          </select>
        </label>
        <label class="filter" data-icon="filter">Uitslag
          <select id="result">
            <option value="all">Alles</option>
            <option value="W">Gewonnen</option>
            <option value="D">Gelijk</option>
            <option value="L">Verloren</option>
          </select>
        </label>
        <a class="filter-link" href="rivalen.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg>Rivalen</a>
      </div>
    </header>

    <div class="match-list-full" id="match-list"><div class="skel card-row"></div><div class="skel card-row"></div><div class="skel card-row"></div></div>
  </main>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script src="common.js"></script>
<script src="wedstrijden.js"></script>
</body>
</html>
