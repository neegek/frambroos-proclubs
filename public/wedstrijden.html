<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijden · Frambroos Coach</title>
<link rel="icon" href="crest.png">
<meta name="theme-color" content="#090b0d">
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <header class="page-head">
      <div>
        <h1>Wedstrijden</h1>
        <p class="sub" id="page-sub">Alle gevolgde wedstrijden.</p>
      </div>
      <div class="filters">
        <label class="filter" data-icon="trophy">Type
          <select id="type">
            <option value="all">League en playoff</option>
            <option value="leagueMatch">League</option>
            <option value="playoffMatch">Playoff</option>
          </select>
        </label>
        <label class="filter" data-icon="filter">Uitslag
          <select id="result">
            <option value="all">Alles</option>
            <option value="W">Gewonnen</option>
            <option value="D">Gelijk</option>
            <option value="L">Verloren</option>
          </select>
        </label>
      </div>
    </header>

    <div class="match-list-full" id="match-list"></div>
  </main>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script src="common.js"></script>
<script src="wedstrijden.js"></script>
</body>
</html>
