<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijd · Frambroos Coach</title>
<link rel="icon" href="crest.png">
<meta name="theme-color" content="#090b0d">
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div class="match-detail" id="m-detail">
      <section class="sess-stage match-stage" aria-labelledby="page-title">
        <div class="ss-visual ms-visual" id="m-visual">
          <p class="ms-kicker" id="page-sub"></p>
          <h1 class="sr-only" id="page-title">Wedstrijd</h1>
          <div class="ms-score scoreline" id="m-score"><div class="skel block"></div></div>
          <p class="ms-meta" id="m-meta"></p>
        </div>
        <div class="ss-panel ms-panel">
          <p class="summary" id="m-summary"><span class="skel text"></span><span class="skel text short"></span></p>
          <div class="ms-motm" id="m-motm"></div>
          <div class="match-nav" id="m-nav"></div>
        </div>
      </section>

      <section class="card pitch-card">
        <h2>Opstelling</h2>
        <p class="hint">Beide teams op één veld, wij links en zij rechts: per linie de mensen met hun rating, per team het aantal AI-spelers; waar die stonden geeft EA niet.</p>
        <div class="field-wrap" id="m-pitches"><div class="skel tall"></div></div>
      </section>

      <section class="card">
        <h2>Wij tegen hen</h2>
        <p class="hint">Totalen van de menselijke spelers aan beide kanten.</p>
        <div id="m-h2h"></div>
      </section>

      <section class="card">
        <h2>Spelers</h2>
        <h3 id="m-ours-title">Frambroos</h3>
        <div id="m-ours"></div>
        <h3 id="m-theirs-title">Tegenstander</h3>
        <div id="m-theirs"></div>
      </section>
    </div>
  </main>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script src="common.js"></script>
<script src="archetypes.js"></script>
<script src="frambroos-index.js"></script>
<script src="playercard.js"></script>
<script src="wedstrijd.js"></script>
</body>
</html>
