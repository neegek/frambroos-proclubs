<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijd · Frambroos Coach</title>
<link rel="icon" href="crest.png">
<meta name="theme-color" content="#090b0d">
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div class="match-detail" id="m-detail">
      <section class="sess-stage match-stage" aria-labelledby="page-title">
        <div class="ss-visual ms-visual" id="m-visual">
          <div class="ss-titlebar" id="m-titlebar"><h1 class="ss-title" id="page-title">…</h1></div>
          <div class="ms-score scoreline" id="m-score"><div class="skel block"></div></div>
          <p class="ms-meta" id="m-meta"></p>
        </div>
        <div class="ms-pitch" id="m-pitches"><div class="skel tall"></div></div>
      </section>

      <section class="card takeaway-card" id="m-kort-card" aria-labelledby="m-kort-title">
        <h2 id="m-kort-title">In het kort</h2>
        <p class="hint">Wat schuurde en wat goed ging, tegenover jullie normaal en de sterkte van de tegenstander. Alleen wat in onze data samenhangt met winnen.</p>
        <ul class="takeaways" id="m-kort"><li class="skel block"></li></ul>
      </section>

      <section class="card">
        <h2>Wij tegen hen</h2>
        <p class="hint">Per cijfer het totaal van beide kanten; tik op een cijfer om iedereen te vergelijken, de beste bovenaan.</p>
        <div id="m-h2h"></div>
      </section>

    </div>
  </main>
</div>
<dialog class="rank-dialog" id="rank-dialog" aria-labelledby="rd-title"><button type="button" class="icon-btn rd-close" aria-label="Sluiten">✕</button><div class="rd-body"></div></dialog>
<div id="tooltip" class="tooltip" hidden></div>
<script src="common.js"></script>
<script src="archetypes.js"></script>
<script src="frambroos-index.js"></script>
<script src="playercard.js"></script>
<script src="wedstrijd.js"></script>
</body>
</html>
