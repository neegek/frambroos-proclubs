<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelers · Frambroos Coach</title>
<link rel="icon" href="crest.png">
<meta name="theme-color" content="#090b0d">
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <section class="chips mobile-only" id="chips"></section>
    <section class="player-hero" id="player-hero" aria-label="Spelerskaart"><div class="pc-wrap"><div class="skel fut"></div></div></section>

    <div class="filters page-filters">
      <label class="filter" data-icon="calendar">Periode
        <select id="range">
          <option value="all">Alles</option>
          <option value="30">Laatste 30 dagen</option>
          <option value="7">Laatste 7 dagen</option>
        </select>
      </label>
      <label class="filter" data-icon="trophy">Type
        <select id="type">
          <option value="all">League en playoff</option>
          <option value="leagueMatch">League</option>
          <option value="playoffMatch">Playoff</option>
        </select>
      </label>
    </div>

    <section class="card">
      <h2 class="card-title">Samenvatting</h2>
      <p class="summary" id="p-summary"><span class="skel text"></span><span class="skel text short"></span></p>
      <div class="sess-figs p-three" id="p-three"><div class="skel row"></div><div class="skel row"></div><div class="skel row"></div></div>
    </section>

    <div class="stat-groups" id="p-stats" aria-label="Cijfers"><div class="skel block"></div><div class="skel block"></div><div class="skel block"></div><div class="skel block"></div></div>

    <section class="card">
      <h2>Wedstrijden van deze speler</h2>
      <p class="hint">De laatste acht; klik op een wedstrijd voor alle cijfers.</p>
      <div id="tbl-player-matches"><div class="skel tall"></div></div>
    </section>
  </main>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script src="common.js"></script>
<script src="archetypes.js"></script>
<script src="frambroos-index.js"></script>
<script src="builds.js"></script>
<script src="playercard.js"></script>
<script src="spelers.js"></script>
</body>
</html>
