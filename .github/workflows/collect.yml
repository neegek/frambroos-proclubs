name: Verzamel wedstrijden

# Twee triggers, samen de hele dag:
# 1. Hoofdtrigger: cron-job.org start deze workflow elke 2 uur (00:00, 02:00, … 22:00, Europe/Amsterdam) via
#    workflow_dispatch. Zie docs/trigger.md. GitHub's eigen planning is daarvoor te onbetrouwbaar.
# 2. Reserve: GitHub's eigen cron elke 3 uur, op minuut 47 (niet op het hele uur, dan is het bij GitHub het drukst).
# EA bewaart 10 wedstrijden per type. Op het snelste gemeten tempo (15 min per wedstrijd) duren 10 wedstrijden
# zo'n 2,5 uur; om de 2 uur draaien laat dus altijd marge. Na een run met nieuwe data volgt de site (site.yml).
on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
      stale: ${{ steps.collect.outputs.stale }}
      missed: ${{ steps.collect.outputs.missed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verzamel
        id: collect
        run: node src/collect.js
      - name: Commit database als er iets nieuws is
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "frambroos-bot"
          git config user.email "frambroos-bot@users.noreply.github.com"
          git add data/proclubs.sqlite
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "data: verzamelrun $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi

  site:
    needs: collect
    # Ook als de site achterloopt (een eerdere deploy mislukte), zodat het zichzelf herstelt.
    if: needs.collect.outputs.changed == 'true' || needs.collect.outputs.stale == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml

  # Melding bij problemen (docs/trigger.md): een issue in deze repo, waar neegek een mail van krijgt.
  # - Mogelijk gemiste wedstrijden (alle 10 van een type nieuw): meteen, want EA geeft oudere wedstrijden niet meer.
  # - Mislukte runs: pas bij drie op rij (een losse hapering herstelt de volgende run zelf). Gaat het weer goed, dan
  #   sluit de eerstvolgende gelukte run het issue.
  alert:
    needs: [collect, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COLLECT: ${{ needs.collect.result }}
      SITE: ${{ needs.site.result }}
      MISSED: ${{ needs.collect.outputs.missed }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Melden of opruimen
        run: |
          FAIL_TITLE="Verzamelaar: runs mislukken"
          MISS_TITLE="Verzamelaar: mogelijk wedstrijden gemist"
          bad() { [ "$1" = failure ] || [ "$1" = cancelled ]; }
          open_issue() { gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$1\") | .number" | head -n 1; }

          if [ -n "$MISSED" ]; then
            body="Run $RUN_URL: alle tien wedstrijden van type \`$MISSED\` waren nieuw. Mogelijk zijn er oudere wedstrijden gemist sinds de vorige run. Kijk in de Actions-tab of runs zijn uitgevallen (docs/trigger.md, *Melding bij problemen*)."
            n=$(open_issue "$MISS_TITLE")
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$MISS_TITLE" --body "$body"; fi
          fi

          n=$(open_issue "$FAIL_TITLE")
          if bad "$COLLECT" || bad "$SITE"; then
            # De twee vorige afgeronde runs (deze telt nog niet mee): ook mislukt? Dan drie op rij.
            prev=$(gh run list --workflow collect.yml --status completed --limit 5 --json databaseId,conclusion \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0:2] | map(select(.conclusion == \"failure\" or .conclusion == \"cancelled\" or .conclusion == \"timed_out\")) | length")
            echo "Deze run: verzamelen $COLLECT, site $SITE. Vorige twee runs mislukt: $prev."
            if [ "$prev" = 2 ] && [ -z "$n" ]; then
              gh issue create --title "$FAIL_TITLE" --body "Drie verzamelruns op rij zijn mislukt, de laatste: $RUN_URL (verzamelen: $COLLECT, site: $SITE). EA bewaart 10 wedstrijden per type: blijft dit zo, dan raken we wedstrijden kwijt. Dit issue gaat vanzelf dicht zodra een run weer lukt (docs/trigger.md, *Melding bij problemen*)."
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Weer gelukt: $RUN_URL."
          fi
