name: Verzamel wedstrijden

# Twee triggers:
# 1. Hoofdtrigger: een externe cron-dienst start deze workflow elk kwartier tussen 19:00 en 02:00
#    (Europe/Amsterdam) via workflow_dispatch. Zie docs/trigger.md. GitHub's eigen planning is daarvoor
#    te onbetrouwbaar: in de praktijk draaide */15 maar om de 2 tot 5 uur.
# 2. Reserve: GitHub's eigen cron, één keer per uur in de avond, op minuut 47 (niet op het hele uur,
#    dan is het bij GitHub het drukst). Uren in UTC; dit dekt ongeveer 19:47–02:47 in de zomer en
#    18:47–01:47 in de winter.
# EA bewaart 10 wedstrijden per type, ruim 3 uur spelen. Eén geslaagde run per 3 uur is dus genoeg.
on:
  schedule:
    - cron: "47 0,17-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verzamel
        id: collect
        run: node src/collect.js
      - name: Commit database als er iets nieuws is
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "frambroos-bot"
          git config user.email "frambroos-bot@users.noreply.github.com"
          git add data/proclubs.sqlite
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "data: verzamelrun $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi
