name: Verzamel wedstrijden

on:
  schedule:
    - cron: "*/15 * * * *"   # elk kwartier (GitHub voert dit bij drukte iets later uit)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verzamel
        run: node src/collect.js
      - name: Commit database als er iets veranderd is
        run: |
          git config user.name "frambroos-bot"
          git config user.email "frambroos-bot@users.noreply.github.com"
          git add data/proclubs.sqlite
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "data: verzamelrun $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi
